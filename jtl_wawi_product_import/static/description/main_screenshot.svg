<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#edf0fb"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f3570"/>
      <stop offset="100%" stop-color="#5d4a9a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dce7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1b2550" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="90" y="70" width="1420" height="760" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="90" y="70" width="1420" height="60" rx="28" fill="url(#header)"/>
  <rect x="90" y="122" width="1420" height="708" fill="#ffffff"/>

  <rect x="120" y="160" width="170" height="36" rx="10" fill="#edf2ff" stroke="#d5ddff"/>
  <text x="205" y="184" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#4338ca">Files</text>
  <rect x="290" y="160" width="170" height="36" rx="10" fill="#f0eefe" stroke="#cbbef8"/>
  <text x="375" y="184" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#5b4aa8">Mapping</text>
  <rect x="460" y="160" width="170" height="36" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="545" y="184" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b7280">Review</text>

  <rect x="120" y="220" width="420" height="250" rx="20" fill="#f7fbff" stroke="#d7e7ff"/>
  <image href="icon.png" x="140" y="242" width="150" height="150" preserveAspectRatio="xMidYMid meet"/>
  <text x="310" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">JTL Import Wizard</text>
  <text x="310" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#4b5563">Upload multiple JTL CSV files and map them per source file.</text>
  <text x="310" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#4b5563">- Article master, manufacturer and EU Responsible</text>
  <text x="310" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#4b5563">- Variants, attributes, supplierinfo and BOM</text>
  <text x="310" y="410" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#4b5563">- Barcode match update and conflict safe import</text>

  <rect x="580" y="220" width="810" height="550" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="580" y="220" width="810" height="52" rx="20" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="610" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">CSV Field Mapping</text>

  <rect x="610" y="292" width="750" height="44" rx="10" fill="url(#blue)"/>
  <text x="630" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Articlestammdaten</text>
  <text x="800" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#374151">Artikelnummer</text>
  <text x="1030" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#374151">Product Variant</text>
  <text x="1200" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#374151">Odoo Field</text>
  <text x="1370" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#374151">Sprache</text>

  <g fill="#f8fafc" stroke="#e5e7eb">
    <rect x="610" y="348" width="750" height="36" rx="8"/>
    <rect x="610" y="392" width="750" height="36" rx="8"/>
    <rect x="610" y="436" width="750" height="36" rx="8"/>
    <rect x="610" y="480" width="750" height="36" rx="8"/>
    <rect x="610" y="524" width="750" height="36" rx="8"/>
    <rect x="610" y="568" width="750" height="36" rx="8"/>
    <rect x="610" y="612" width="750" height="36" rx="8"/>
    <rect x="610" y="656" width="750" height="36" rx="8"/>
  </g>

  <rect x="1240" y="728" width="120" height="34" rx="10" fill="#ede9fe"/>
  <text x="1300" y="751" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#5b4aa8">Validate</text>
  <rect x="1120" y="728" width="100" height="34" rx="10" fill="#eef2ff"/>
  <text x="1170" y="751" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#4338ca">Next</text>

  <rect x="120" y="520" width="420" height="250" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="145" y="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Highlights</text>
  <text x="145" y="595" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7c2d12">- Per-file tabs for each CSV bundle</text>
  <text x="145" y="625" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7c2d12">- Dynamic header parsing and auto mapping</text>
  <text x="145" y="655" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7c2d12">- EU Responsible, dimensions and volume sync</text>
  <text x="145" y="685" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7c2d12">- Queue-based batch processing in Odoo</text>
</svg>
